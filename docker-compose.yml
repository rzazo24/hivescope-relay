x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  relay:
    build: .
    container_name: hivescope-relay
    restart: unless-stopped
    logging: *default-logging
    environment:
      HIVESCOPE_DB_PATH: /app/data/hivescope-relay.sqlite
      HIVESCOPE_LISTEN_ADDR: ":3334"
      HIVESCOPE_HIVE_NODE: https://api.hive.blog
      # Puede renombrar/editar cualquier sala, no solo las que crea o
      # administra -- ver NewRoomMetaPolicy en internal/policies/roommeta.go.
      HIVESCOPE_SUPERADMIN_HIVE_ACCOUNT: rzazo24
    volumes:
      - relay-data:/app/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "/app/hivescope-relay", "--healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: hivescope-caddy
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      relay:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web/tools:/srv/tools:ro
      # Build estático de hivescope-web (repo aparte, ver Caddyfile).
      # Hay que correr `npm run build` ahí antes de recrear este contenedor
      # para desplegar una versión nueva.
      - ../hivescope-web/dist:/srv/chat:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

networks:
  internal:

volumes:
  relay-data:
  caddy-data:
  caddy-config:
