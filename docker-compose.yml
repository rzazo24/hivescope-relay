services:
  relay:
    build: .
    container_name: hivescope-relay
    restart: unless-stopped
    environment:
      HIVESCOPE_DB_PATH: /app/data/hivescope-relay.sqlite
      HIVESCOPE_LISTEN_ADDR: ":3334"
      HIVESCOPE_HIVE_NODE: https://api.hive.blog
    volumes:
      - relay-data:/app/data
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    container_name: hivescope-caddy
    restart: unless-stopped
    depends_on:
      - relay
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web/tools:/srv/tools:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - internal

networks:
  internal:

volumes:
  relay-data:
  caddy-data:
  caddy-config:
